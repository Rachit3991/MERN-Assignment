<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Student Registration Form - HTML Assignment">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
</head>

<body>

  <header>
    <h1>Student Registration Form</h1>
    <p>Please fill in the details to complete your registration.</p>
  </header>

  <main>
    <form action="#" method="post">

      <fieldset>
        <legend>Personal Information</legend>

        <p>
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname"
                 placeholder="Enter your full name" required>
        </p>

        <p>
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email"
                 placeholder="example@email.com" required>
        </p>

        <p>
          <label for="phone">Phone Number:</label>
          <input type="tel" id="phone" name="phone"
                 placeholder="Enter your phone number" required>
        </p>

        <p>
          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob" required>
        </p>

        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

      </fieldset>

      <fieldset>
        <legend>Academic Information</legend>

        <p>
          <label for="studentid">Student ID:</label>
          <input type="text" id="studentid" name="studentid"
                 placeholder="Enter student ID" required>
        </p>

        <p>
          <label for="course">Select Course:</label>
          <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="BCA AI">BCA Artificial Intelligence</option>
            <option value="BCA">BCA</option>
            <option value="BTech CS">B.Tech Computer Science</option>
            <option value="BBA">BBA</option>
            <option value="BCom">B.Com</option>
          </select>
        </p>

        <p>
          <label for="semester">Semester:</label>
          <select id="semester" name="semester" required>
            <option value="">-- Select Semester --</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
            <option value="5">Semester 5</option>
            <option value="6">Semester 6</option>
          </select>
        </p>

        <p>
          <label for="college">College Name:</label>
          <input type="text" id="college" name="college"
                 placeholder="Enter college name" required>
        </p>

      </fieldset>

      <fieldset>
        <legend>Address Information</legend>

        <p>
          <label for="address">Full Address:</label>
          <textarea id="address" name="address" rows="4" cols="40"
                    placeholder="Enter your complete address"
                    required></textarea>
        </p>

        <p>
          <label for="city">City:</label>
          <input type="text" id="city" name="city" required>
        </p>

        <p>
          <label for="state">State:</label>
          <input type="text" id="state" name="state" required>
        </p>

        <p>
          <label for="pincode">PIN Code:</label>
          <input type="text" id="pincode" name="pincode"
                 pattern="[0-9]{6}"
                 title="Enter a valid 6-digit PIN code" required>
        </p>

      </fieldset>

      <fieldset>
        <legend>Additional Information</legend>

        <p>
          <label for="hobbies">Hobbies and Interests:</label>
          <textarea id="hobbies" name="hobbies" rows="3" cols="40"
                    placeholder="Enter your hobbies"></textarea>
        </p>

        <p>
          <input type="checkbox" id="declaration" name="declaration"
                 required>
          <label for="declaration">
            I confirm that the information provided is correct.
          </label>
        </p>

      </fieldset>

      <p>
        <button type="submit">Register</button>
        <button type="reset">Reset Form</button>
      </p>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Student Registration Form</p>
  </footer>

</body>

</html>
