<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive photo gallery created by Rachit Saxena using CSS Grid.">
  <title>CSS Grid Photo Gallery - Rachit Saxena</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 180px;
      gap: 10px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .gallery figure {
      overflow: hidden;
      border-radius: 10px;
      position: relative;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s;
    }

    .gallery figure:hover img {
      transform: scale(1.08);
    }

    .gallery figcaption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.5rem;
      background: rgba(0, 0, 0, 0.6);
      font-size: 0.85rem;
    }

    .wide {
      grid-column: span 2;
    }

    .tall {
      grid-row: span 2;
    }

    .big {
      grid-column: span 2;
      grid-row: span 2;
    }

    @media (max-width: 800px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .wide,
      .big {
        grid-column: auto;
      }

      .tall,
      .big {
        grid-row: auto;
      }
    }
  </style>
</head>

<body>

  <h1>Rachit's Photo Gallery</h1>

  <div class="gallery">

    <figure class="big">
      <img src="https://picsum.photos/id/1015/800/800"
        alt="River winding through a green valley">
      <figcaption>Beautiful River Valley</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1016/400/400"
        alt="Canyon walls">
      <figcaption>Mountain Canyon</figcaption>
    </figure>

    <figure class="tall">
      <img src="https://picsum.photos/id/1018/400/800"
        alt="Misty mountain peak">
      <figcaption>Misty Mountain Peak</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1019/400/400"
        alt="Wooden jetty on a lake">
      <figcaption>Peaceful Lake</figcaption>
    </figure>

    <figure class="wide">
      <img src="https://picsum.photos/id/1036/800/400"
        alt="Snow-covered pine forest">
      <figcaption>Winter Forest</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1039/400/400"
        alt="Waterfall surrounded by nature">
      <figcaption>Beautiful Waterfall</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1043/400/400"
        alt="Evening sky over a field">
      <figcaption>Evening Sky</figcaption>
    </figure>

  </div>

</body>

</html>
