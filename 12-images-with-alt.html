<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images with Alt Text</title>
</head>
<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Four images with alternative text.</p>
    </header>

    <main>
        <section>
            <h2>My Images</h2>

            <figure>
                <img src="images/mountain.jpg"
                     alt="Snow-covered mountains beneath a blue sky"
                     width="300">
                <figcaption>1. Mountain</figcaption>
            </figure>

            <figure>
                <img src="images/forest.jpg"
                     alt="A green forest filled with tall trees"
                     width="300">
                <figcaption>2. Forest</figcaption>
            </figure>

            <figure>
                <img src="images/flower.jpg"
                     alt="A red flower with green leaves"
                     width="300">
                <figcaption>3. Flower</figcaption>
            </figure>

            <figure>
                <img src="images/cat.jpg"
                     alt="A cat sitting and looking toward the camera"
                     width="300">
                <figcaption>4. Cat</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Image Gallery</p>
    </footer>

</body>
</html>
