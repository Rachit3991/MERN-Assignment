<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32 - Flex Centered Login | Rachit Saxena</title>

    <style>
        :root {
            --primary: #1f3a93;
            --secondary: #f4a261;
            --background: #f4f6f9;
            --white: #ffffff;
            --text: #222222;
            --border: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;

            /* Center the login card using Flexbox */
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--white);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            display: inline-block;
            background-color: var(--primary);
            color: var(--white);
            width: 65px;
            height: 65px;
            line-height: 65px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .login-header h1 {
            color: var(--primary);
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 5px rgba(31, 58, 147, 0.2);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 22px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember input {
            width: auto;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-button:hover {
            background-color: var(--secondary);
            color: var(--text);
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: #777777;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #dddddd;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777777;
            font-size: 12px;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .form-options {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <!-- Login Header -->
        <header class="login-header">
            <div class="logo">RS</div>

            <h1>Welcome Back!</h1>

            <p>Login to continue to your account</p>
        </header>

        <!-- Login Form -->
        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                >
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>

                <a href="#forgot">Forgot Password?</a>
            </div>

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <div class="divider">OR</div>

        <!-- Registration Link -->
        <div class="signup">
            Don't have an account?
            <a href="#signup">Sign Up</a>
        </div>

        <footer class="footer">
            <p>Designed by Rachit Saxena</p>
            <p>BCA Artificial Intelligence | Invertis University</p>
            <p>&copy; 2026 All Rights Reserved</p>
        </footer>

    </main>

    <script>
        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Login form submitted successfully! This is a demo page.");
        });
    </script>

</body>
</html>
